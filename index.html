<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo Sabor – Ficha Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121110;--card:#1b1917;--card2:#25221f;--line:#36312b;--txt:#f3eee8;--mut:#a59d93;
  --acc:#f2a33a;--bad:#e5534b;--ok:#4cbb7a;
  --c-ing:#f2a33a;--c-emb:#c9b08a;--c-taxa:#9a7fe0;--c-ent:#e07b9a;--c-fixo:#5b8fd6;--c-lucro:#4cbb7a;
  --c-hb:#f2a33a;--c-al:#5b8fd6;--c-cb:#e07b9a;--c-bb:#c9b08a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4}
header{max-width:1480px;margin:0 auto;padding:20px 20px 0}
h1{font-size:24px;margin:0;letter-spacing:-.3px}
h2{font-size:17px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:14px 20px;max-width:1480px;margin:0 auto;position:sticky;top:0;background:var(--bg);z-index:5;align-items:center}
nav .gbtn{background:transparent;border:1px solid var(--acc);color:var(--acc);font-weight:600}
nav .gbtn.on{background:#2a2117;color:var(--acc);border-color:var(--acc)}
nav .sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .hd{font-size:11px;color:var(--mut);text-align:center;padding:4px}
.cal .d{background:var(--card2);border:1px solid var(--line);border-radius:8px;min-height:78px;padding:5px;cursor:pointer;text-align:left;font:inherit;color:var(--txt);display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .d.hoje{border-color:var(--acc)}
.cal .d.sel{box-shadow:0 0 0 2px var(--acc) inset}
.cal .d .n{font-size:12px;font-weight:600}
.cal .vz{background:transparent;border:0;cursor:default}
.pl{font-size:10.5px;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pl.ok{background:#173524;color:#9fe0b8}.pl.falta{background:#4a1d1a;color:#ffb3ab}.pl.pend{background:#3a2f1d;color:#f0d9b5}.pl.esc{background:#2c2925;color:var(--mut)}.pl.extra{background:#1d2a3a;color:#a9c8f0}
.legenda .pl{display:inline-block;margin-right:4px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pcard.alerta-c{border-color:#6b2a25}
.pcard .ph{display:flex;align-items:center;gap:10px}
.av{width:44px;height:44px;border-radius:50%;background:#2a2117;border:1px solid #4a3a24;display:flex;align-items:center;justify-content:center;flex:none}
.pcard .nm{font-weight:600;font-size:15px;line-height:1.2}
.pst{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pst div{background:var(--card);border-radius:8px;padding:8px 10px}
.pst .l{font-size:11px;color:var(--mut)}
.pst .v{font-size:18px;font-weight:700}
.pst .s{font-size:11px;color:var(--mut)}
.ptur{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.ptur b{color:var(--txt);font-weight:600}
.dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dcard{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font:inherit;color:var(--txt);text-align:left}
.dcard.ok,.dcard.extra{border-left-color:var(--ok)}.dcard.falta{border-left-color:var(--bad)}.dcard.pend{border-left-color:#c9a24a}.dcard.disp{opacity:.6}
.dcard .ph{display:flex;gap:8px;align-items:center}.dcard .nm{font-weight:600;font-size:14px}
.dcard .dv{font-size:18px;font-weight:700}.dac{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dcard.add{border-style:dashed;border-left-width:1px}.vazio-add{align-items:center;justify-content:center;cursor:pointer;color:var(--mut);min-height:110px}
.vazio-add:hover{border-color:var(--acc);color:var(--acc)}
.av.sm{width:32px;height:32px}
.pl.disp{background:#2c2925;color:#6f675e;text-decoration:line-through}
.pcard.hojepag{border-color:var(--ok)}
.mini{display:flex;gap:3px}.mini span{width:22px;height:22px;border-radius:5px;background:var(--card);color:#6f675e;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}.mini span.on{background:#2a2117;color:var(--acc)}
.edit{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.lgrid .card{margin:0}
.lrow{display:flex;gap:8px;align-items:center;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.lrow .lnm{flex:1;font-weight:500}.lrow .btn.x{padding:3px 8px}
.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#1a1206;border:0;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:15}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%)}
input[type=time]{color-scheme:dark}
.btn:disabled{opacity:.45;cursor:default}
.pertabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ptab{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:12px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.ptab.on{background:#2a2117;border-color:var(--acc);color:var(--acc)}
.vgt{font-size:13px;font-weight:600;color:var(--acc);margin:16px 0 8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
@media(max-width:600px){.vgrid{grid-template-columns:1fr 1fr;gap:8px}.vbody{padding:10px 6px 6px}.vbody .em{font-size:28px}.vbody .vn{font-size:13px}.pertabs .ptab{font-size:14px;padding:10px 6px}}
.vcard{background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.vcard.tem{border-color:var(--acc);background:#241d15}
.vcard.pulse{animation:pulse .25s}
@keyframes pulse{50%{transform:scale(.97)}}
.vbody{background:none;border:0;color:var(--txt);font:inherit;cursor:pointer;padding:14px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.vbody .em{font-size:34px;line-height:1}
.vbody .vn{font-weight:600;font-size:14px;line-height:1.2}
.vbody .vp{font-size:12px;color:var(--mut)}
.vctl{display:grid;grid-template-columns:44px 1fr 44px;border-top:1px solid var(--line)}
.vctl button{background:none;border:0;color:var(--txt);font-size:22px;cursor:pointer;padding:6px 0}
.vctl button:first-child{color:var(--mut)}
.vctl button:last-child{color:var(--acc)}
.vctl .vq{display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.vcard:not(.tem) .vq{color:#6f675e}
details.outros{margin-top:14px}details.outros summary{cursor:pointer;color:var(--mut);font-size:13px}
.scard .sh{display:flex;gap:10px;align-items:center;margin-bottom:12px}.scard .sem{font-size:30px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sgrid div{background:var(--card2);border-radius:8px;padding:8px 10px}
.sgrid .l{font-size:11px;color:var(--mut)}.sgrid .v{font-size:18px;font-weight:700}
.eqfaixa{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.eqmini{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 10px;min-width:210px;flex:none}
.eqmini.ok,.eqmini.extra{border-left-color:var(--ok)}.eqmini.falta{border-left-color:var(--bad)}.eqmini.pend{border-left-color:#c9a24a}.eqmini.disp{opacity:.55}
.eqmini .eqt{flex:1;min-width:0}.eqmini .nm{font-size:14px;font-weight:600;white-space:nowrap}
.mini-b{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:15px;cursor:pointer}
.mini-b.ok{color:var(--ok)}.mini-b.no{color:var(--bad);font-weight:700}
.fab.ent{left:28px;right:auto;background:#5b8fd6;color:#fff;font-size:28px}
.entl{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.entb{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--txt);font:inherit;cursor:pointer}
.entb.big{border-color:#5b8fd6;padding:14px}
.entb .plus{font-size:18px;font-weight:700;color:#8fb4ea;background:#1d2a3a;border-radius:8px;padding:6px 10px}
.embtn{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-size:22px;cursor:pointer}
.empal{display:flex;flex-wrap:wrap;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 12px;width:100%}
.empal button{width:40px;height:40px;border:0;background:none;font-size:22px;cursor:pointer;border-radius:8px}
.empal button:hover{background:var(--card)}
.pcard.sel-c{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.pagbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border-radius:8px;padding:8px 10px}
.pagbox .l{font-size:11px;color:var(--mut)}.pagbox .v{font-size:18px;font-weight:700}.pagbox .s{font-size:11px;color:var(--mut)}
.pagbox select{padding:5px 8px;margin:2px 0}
.valt{display:grid;grid-template-columns:62px 1fr 1fr 1fr;gap:6px;align-items:end;font-size:13px}
.valt b{padding-bottom:9px}
.pcard .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-fix{min-height:52px;align-items:flex-start!important}
.tagline{min-height:22px}
.pst{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.pst > div{min-height:84px;min-width:0}
.pst .v{font-size:16px!important;white-space:nowrap}
.pst .l{min-height:15px;white-space:nowrap}
.pst .s{min-height:28px}
.pagbox > div{min-width:0}
.pcard .bottom{margin-top:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#173524;color:#9fe0b8;border:1px solid #2f6b47;border-radius:999px;padding:10px 18px;font-size:14px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cbtn{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:18px 10px;font:inherit;color:var(--txt);font-size:16px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.cbtn span{font-size:28px}.cbtn:hover{border-color:var(--acc)}
.vqs{font-size:11px;color:var(--mut);text-align:center;padding:0 6px 6px;min-height:15px}
.eqadd{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line);border-radius:10px;min-width:150px;padding:8px 14px;color:var(--mut);background:none;font:inherit;cursor:pointer;flex:none}
.eqadd:hover{border-color:var(--acc);color:var(--acc)}
.ftab{width:100%;border-collapse:collapse}.ftab td,.ftab th{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.ftab input{padding:6px 8px}
.tdias{display:flex;gap:3px}.tdias button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:11px;font-weight:600;cursor:pointer}
.tdias button.on{background:var(--acc);color:#1a1206;border-color:var(--acc)}
.papps{display:flex;flex-wrap:wrap;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 12px}
.cxgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start;margin-bottom:14px}
.cxside{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow:auto}
@media(max-width:1000px){.cxgrid{grid-template-columns:1fr}.cxside{position:static;max-height:none}}
.cline{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cline .em{font-size:24px}.cline .nm{font-weight:600;font-size:14px}
.cq{display:flex;align-items:center;gap:6px}.cq button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;font-size:16px}
.cq b{min-width:18px;text-align:center}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.ctot{display:flex;justify-content:space-between;padding:10px 0;font-size:15px}.ctot b{font-size:20px}
.vbadge{position:absolute;top:8px;right:8px;background:var(--acc);color:#1a1206;border-radius:999px;min-width:22px;height:22px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.vbody{position:relative}
.hped{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:var(--card2)}
.hped.on{border-color:var(--acc)}
.hhead{display:flex;gap:8px;align-items:center;width:100%;background:none;border:0;color:var(--txt);font:inherit;font-size:13px;cursor:pointer;padding:0 0 4px}
.hedit{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.fstep{font-weight:600;font-size:14px;color:var(--acc);margin:14px 0 8px}
.entb.sel{border-color:var(--ok)}
.cartbar{display:none}
@media(max-width:1000px){.cartbar{display:block;position:fixed;left:12px;right:12px;bottom:12px;z-index:16;background:var(--acc);color:#1a1206;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.5);cursor:pointer}}
.hojeg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
.hojeg .card{margin-bottom:0}
@media(max-width:900px){.hojeg{grid-template-columns:1fr}}
nav button,.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
nav button.on,.chip.on{background:var(--acc);color:#1a1206;border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chips .lbl{font-size:12px;color:var(--mut);margin-right:4px}
.chip{padding:7px 12px;font-size:14px}
main{max-width:1480px;margin:0 auto;padding:4px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.dica{background:#2a2117;border:1px solid #4a3a24;color:#f0d9b5;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.alerta{background:#2d1715;border:1px solid #6b2a25;color:#ffc9c4;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;min-width:0;width:100%}
input[type=month],input[type=date]{color-scheme:dark}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);color:#1a1206;border-color:var(--acc);font-weight:600}
.btn.del{color:var(--bad)}
.btn.del.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.x{padding:6px 10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--txt);padding:8px 0;cursor:pointer}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 0;border-top:1px solid var(--line)}
.linha:first-child{border-top:0;padding-top:0}
.calcv{font-weight:600;color:var(--txt);font-size:14px;padding:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpis .card{margin-bottom:0}
.kpi .l{color:var(--mut);font-size:13px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0 14px}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lb{margin-bottom:14px}
.lbh{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px;flex-wrap:wrap}
.lbh span{color:var(--mut)}
.bar{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--card2)}
.bar span{height:100%;border-right:2px solid var(--card)}
.bar span:last-child{border-right:0}
.lh{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.lh .nome{font-size:17px;font-weight:600}
.item{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.item select{flex:1 1 220px}
.item .q{width:90px}
.item .un{color:var(--mut);font-size:13px;min-width:56px}
.item .lc{min-width:80px;text-align:right;font-size:14px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:14px}
.cbox{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--txt)}
.cbox.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.cbox .n{font-size:12px;color:var(--mut)}
.cbox .p{font-size:12px;color:var(--mut);margin-top:2px}
.cbox .v{font-size:18px;font-weight:700;margin-top:2px}
.resumo{margin-top:10px;background:var(--card2);border-radius:10px;padding:12px 14px}
.resumo .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.resumo .r span:first-child{color:var(--mut)}
.resumo .r i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.resumo .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600}
.resumo .big{font-size:16px}
.resumo .ttl{font-size:13px;color:var(--acc);font-weight:600;margin-bottom:6px}
.sug{margin-top:8px;font-size:13px;color:#f0d9b5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.grid2 .card{margin-bottom:0}
.vazio{color:var(--mut);text-align:center;padding:30px}
.ok-msg{color:var(--ok);font-size:13px;margin-left:8px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--mut);margin-left:6px;vertical-align:2px}
.tag.bad{background:#4a1d1a;color:#ffb3ab}

<footer>Os dados ficam salvos neste navegador. Para passar para outro aparelho, use o backup em "Ajustes".</footer>

<script>
const KEY = 'novoSabor_v4';
const fmt = v => (isFinite(v) ? v : 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const fmtUn = v => (isFinite(v) ? v : 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', minimumFractionDigits:2, maximumFractionDigits: Math.abs(v) < 1 ? 3 : 2});
const pct = v => (isFinite(v) ? v : 0).toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
const int = v => Math.round(v || 0).toLocaleString('pt-BR');
const num = v => { let s = String(v ?? '').trim(); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? 0 : n; };
const nv = n => (n === '' || n == null) ? '' : String(n).replace('.', ',');
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = (arr, id) => arr.find(x => x.id === id);
const pad = n => String(n).padStart(2, '0');
const hoje = new Date();
const mesHoje = `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}`;
const dataHoje = `${mesHoje}-${pad(hoje.getDate())}`;
const addMes = (ym, d) => { const [y, m] = ym.split('-').map(Number); const dt = new Date(y, m - 1 + d, 1); return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`; };
const diasMes = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const nomeMes = (ym, longo) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', longo ? {month:'long', year:'numeric'} : {month:'short', year:'2-digit'}).replace('.', '').replace(' de ', '/'); };
const dataBR = d => d.split('-').reverse().join('/');
const dow = d => new Date(d + 'T12:00').getDay();
const DIAS = ['D','S','T','Q','Q','S','S'];
const DIAS_NOME = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const SETORES = {hamburgueria:'Hamburgueria', almoco:'Almoço', combo:'Combos'};
const COR_SETOR = {hamburgueria:'var(--c-hb)', almoco:'var(--c-al)', combo:'var(--c-cb)', bebida:'var(--c-bb)'};

/* =================== EXEMPLO =================== */
function pagEx(funcs, diarias){
  const out = [], f2 = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  funcs.forEach(f => {
    for (let back = 1; back < 70; back++) {
      const d = new Date(hoje); d.setDate(d.getDate() - back); if (d.getDay() !== 3) continue;
      const dom = new Date(d); dom.setDate(d.getDate() - 3); const seg = new Date(dom); seg.setDate(dom.getDate() - 6);
      const de = f2(seg), ate = f2(dom), valor = diarias.filter(x => x.func === f.id && x.data >= de && x.data <= ate).reduce((a, x) => a + x.valor, 0);
      if (valor > 0) out.push({id:uid(), func:f.id, data:f2(d), de, ate, valor});
    }
  });
  return out;
}
function exemplo(){
  const I = (nome, cat, preco, rende, unidade) => ({id:uid(), nome, cat, preco, rende, unidade});
  const ing = [
    I('Pão de hambúrguer (pacote)','ingrediente',12,12,'un'),
    I('Carne moída (kg)','ingrediente',40,1000,'g'),
    I('Mussarela (kg)','ingrediente',42,1000,'g'),
    I('Bacon (kg)','ingrediente',38,1000,'g'),
    I('Alface (pé)','ingrediente',4,20,'porção'),
    I('Tomate (kg)','ingrediente',7,40,'fatia'),
    I('Cebola caramelizada (receita)','ingrediente',6,15,'porção'),
    I('Maionese da casa (pote)','ingrediente',18,60,'porção'),
    I('Ovo (bandeja com 30)','ingrediente',22,30,'un'),
    I('Batata palito congelada (2 kg)','ingrediente',25,2000,'g'),
    I('Arroz (pacote 5 kg)','ingrediente',28,5000,'g'),
    I('Feijão (kg)','ingrediente',9,1000,'g'),
    I('Frango (kg)','ingrediente',18,1000,'g'),
    I('Bife / contra-filé (kg)','ingrediente',45,1000,'g'),
    I('Batata (kg)','ingrediente',6,1000,'g'),
    I('Óleo (900 ml)','ingrediente',8,900,'ml'),
    I('Caixa de hambúrguer (pacote 100)','embalagem',45,100,'un'),
    I('Embalagem de batata (pacote 100)','embalagem',30,100,'un'),
    I('Sachê de ketchup (caixa 200)','embalagem',25,200,'un'),
    I('Guardanapo + saquinho (pacote 100)','embalagem',20,100,'un'),
    I('Marmitex alumínio (pacote 100)','embalagem',55,100,'un'),
    I('Kit talher descartável (pacote 50)','embalagem',12,50,'un'),
  ];
  const g = n => ing.find(i => i.nome.startsWith(n)).id;
  const it = (n, q) => ({ing:g(n), qtd:q});
  const base = () => [it('Pão',1),it('Carne',150),it('Mussarela',40),it('Maionese',1),it('Caixa',1),it('Sachê',2),it('Guardanapo',1)];
  const P = (nome, setor, preco, precoApp, itens) => ({id:uid(), nome, setor, preco, precoApp, itens});
  const xb = P('X-Burguer','hamburgueria',22,26,base());
  const bat = P('Batata frita (porção)','hamburgueria',14,17,[it('Batata palito',250),it('Óleo',50),it('Embalagem de batata',1),it('Sachê',2)]);
  const produtos = [
    xb,
    P('X-Bacon','hamburgueria',27,32,[...base(),it('Bacon',30),it('Alface',1),it('Tomate',2)]),
    P('X-Cebola Caramelizada','hamburgueria',28,33,[...base(),it('Cebola',1),it('Bacon',20)]),
    P('X-Tudo','hamburgueria',32,38,[...base(),it('Bacon',30),it('Ovo',1),it('Alface',1),it('Tomate',2),it('Cebola',1)]),
    bat,
    P('Marmita P (frango)','almoco',18,22,[it('Arroz',150),it('Feijão',100),it('Frango',150),it('Batata (kg)',100),it('Alface',1),it('Óleo',20),it('Marmitex',1),it('Kit talher',1)]),
    P('Marmita G (bife)','almoco',25,30,[it('Arroz',250),it('Feijão',150),it('Bife',180),it('Batata (kg)',150),it('Alface',1),it('Óleo',30),it('Marmitex',1),it('Kit talher',1)]),
    P('Prato feito no local','almoco',22,0,[it('Arroz',200),it('Feijão',120),it('Bife',160),it('Batata (kg)',120),it('Alface',1),it('Tomate',2),it('Óleo',25)]),
  ];
  const revenda = [
    {id:uid(), nome:'Refrigerante lata 350ml', custo:3.2, preco:6},
    {id:uid(), nome:'Refrigerante 2L', custo:7.5, preco:14},
    {id:uid(), nome:'Água 500ml', custo:1.2, preco:4},
  ];
  produtos.push({id:uid(), nome:'Combo X-Burguer', setor:'combo', preco:34, precoApp:40, itens:[], comp:[{tipo:'prod', id:xb.id, qtd:1},{tipo:'prod', id:bat.id, qtd:1},{tipo:'rev', id:revenda[0].id, qtd:1}]});
  const apps = [
    {id:'app_ifood', nome:'iFood', comissao:12, taxaPag:3.2, quemEntrega:'loja', freteGratis:false, frete:6},
    {id:'app_99', nome:'99Food', comissao:10, taxaPag:3.2, quemEntrega:'app', freteGratis:true, frete:6},
  ];
  const turnos = [
    {id:uid(), nome:'Almoço', ini:'10:30', fim:'14:00', minimo:60, porEntrega:8},
    {id:uid(), nome:'Noite', ini:'18:30', fim:'23:30', minimo:80, porEntrega:10},
  ];
  const funcs = [
    {id:uid(), nome:'João (exemplo)', tipo:'entregador', diaria:0, ativo:true, escala:{dias:[0,1,2,3,4,5,6], turno:turnos[1].id}},
    {id:uid(), nome:'Pedro (exemplo)', tipo:'entregador', diaria:0, ativo:true, escala:{dias:[1,2,3,4,5], turno:turnos[0].id}},
    {id:uid(), nome:'Maria – cozinha (exemplo)', tipo:'fixo', diaria:70, ativo:true, escala:{dias:[0,1,2,3,4,5,6], turno:turnos[1].id}},
    {id:uid(), nome:'Lucas (saiu – exemplo)', tipo:'entregador', diaria:0, ativo:false, escala:{dias:[5,6], turno:turnos[1].id}},
  ];
  let seed = 11; const rnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed % (b - a + 1)); };
  const diarias = [], faltas = [], vendas = {};
  const baseMes = {}; [380,320,170,260,300,300,220,110,180].forEach((q, i) => baseMes[produtos[i].id] = q);
  [520,120,160].forEach((q, i) => baseMes[revenda[i].id] = q);
  const canaisEx = [['balcao',.40],['propria',.30],['app_ifood',.22],['app_99',.08]];
  const faltasPedro = new Set([3, 6, 10]);
  [-2, -1, 0].forEach(off => {
    const ym = addMes(mesHoje, off), dm = diasMes(ym), ate = off === 0 ? hoje.getDate() : dm;
    for (let d = 1; d <= ate; d++) {
      const data = `${ym}-${pad(d)}`, dw = dow(data);
      const L = (f, t, e) => { const tr = turnos[t], fu = funcs[f]; const valor = fu.tipo === 'fixo' ? fu.diaria : Math.max(tr.minimo, e * tr.porEntrega); diarias.push({id:uid(), data, func:fu.id, turno:tr.id, entregas:e, valor}); };
      L(0, 1, rnd(5, 15));
      L(2, 1, 0);
      if (dw >= 1 && dw <= 5) {
        if (off === 0 && faltasPedro.has(d)) faltas.push({id:uid(), data, func:funcs[1].id, turno:turnos[0].id});
        else L(1, 0, rnd(4, 10));
      }
      if ((dw === 5 || dw === 6) && off < 0) L(3, 1, rnd(6, 14));
      // vendas do dia
      const fds = (dw === 5 || dw === 6) ? 1.4 : (dw === 0 ? 1.1 : 0.85);
      const dia = {};
      canaisEx.forEach(([c, share]) => {
        const v = {}; let pedidos = 0;
        Object.entries(baseMes).forEach(([id, q]) => {
          const prod = byId(produtos, id);
          if (prod && prod.setor === 'almoco' && (dw === 0 || dw === 6)) return;
          if (prod && prod.setor === 'almoco' && c === 'app_99') return;
          const qt = Math.round(q / 30 * share * fds * (0.6 + rnd(0, 80) / 100));
          if (qt > 0) { v[id] = qt; if (prod) pedidos += qt; }
        });
        if (c !== 'balcao') v._pedidos = Math.round(pedidos * 0.75);
        dia[c] = v;
      });
      vendas[data] = dia;
    }
  });
  return {
    loja:'Novo Sabor',
    config:{taxa:3.5, margem:30, vendasMes:1900, taxaEntrega:0, custoEntrega:9, limiteFaltas:2, sim:1900},
    apps, ingredientes:ing, produtos, revenda,
    gastos:[
      {id:uid(), nome:'Aluguel', valor:1500},
      {id:uid(), nome:'Energia', valor:450},
      {id:uid(), nome:'Gás', valor:380},
      {id:uid(), nome:'Água', valor:120},
      {id:uid(), nome:'Internet', valor:100},
      {id:uid(), nome:'MEI / contador', valor:80},
    ],
    turnos, funcionarios:funcs, diarias, faltas, vendas, extras:[], dispensas:[], pagamentos: pagEx(funcs, diarias),
    ui:{}
  };
}

/* =================== ESTADO =================== */
let S, CACHE = {};
const UI_PADRAO = () => ({mes:mesHoje, dia:dataHoje, setor:'hamburgueria', painelSetor:'todos', canal:'balcao', canalDia:'balcao', periodo:periodoAgora()});
function valido(d){ return d && d.config && ['ingredientes','produtos','revenda','gastos','turnos','funcionarios','diarias','apps'].every(k => Array.isArray(d[k])) && d.vendas && typeof d.vendas === 'object'; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (valido(d)) return d; } } catch(e) {}
  return exemplo();
}
function save(){ CACHE = {}; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function hm2min(s){ const [a, b] = String(s || '').split(':').map(Number); return isNaN(a) ? null : a * 60 + (b || 0); }
function ehEnt(f){ if (!f) return false; const fn = byId(S.funcoes || [], f.funcao); return fn ? !!fn.entrega : f.tipo !== 'fixo'; }
const funcaoDe = f => byId(S.funcoes || [], f && f.funcao);
function migrarFuncoes(){
  if (S.funcoes) return;
  const ent = {id:'fn_ent', nome:'Entregador', entrega:true, valores:{}}, coz = {id:'fn_coz', nome:'Cozinha', entrega:false, valores:{}};
  const fx = S.funcionarios.find(f => f.tipo === 'fixo'), d = fx ? num(fx.diaria) : 70;
  S.turnos.forEach(t => { ent.valores[t.id] = {fixo:num(t.minimo), porEntrega:num(t.porEntrega)}; coz.valores[t.id] = {fixo:d}; });
  const alm = S.turnos.find(t => /^Almo/.test(t.nome) && t.ini === '10:30'); if (alm) alm.ini = '10:00';
  const noite = S.turnos.find(t => /^Noite/.test(t.nome) && t.fim === '23:30' && !t.dias); if (noite) { noite.nome = 'Noite (até 23h30)'; noite.dias = [0,1,2,3,4]; }
  if (!S.turnos.some(t => hm2min(t.fim) != null && hm2min(t.fim) < hm2min(t.ini))) {
    const nl = {id:uid(), nome:'Noite longa (até 3h)', ini:'18:30', fim:'03:00', dias:[5,6], setor:'hamburgueria'};
    S.turnos.push(nl); ent.valores[nl.id] = {fixo:100, porEntrega:10}; coz.valores[nl.id] = {fixo:d + 20};
  }
  S.funcoes = [ent, coz];
  S.funcionarios.forEach(f => { if (!f.funcao) f.funcao = f.tipo === 'fixo' ? 'fn_coz' : 'fn_ent'; });
}
function prep(){ S.ui = Object.assign(UI_PADRAO(), S.ui || {}); S.faltas = S.faltas || []; S.extras = S.extras || []; S.dispensas = S.dispensas || []; S.pagamentos = S.pagamentos || []; S.entLog = S.entLog || []; S.vendaLog = S.vendaLog || []; S.pedidos = S.pedidos || []; migrarFuncoes();
  if (!S.turnosV2) {
    S.turnos.forEach(t => {
      if (!t.ini) {
        if (/^almo/i.test(t.nome)) { t.ini = '10:00'; t.fim = '14:00'; t.setor = 'almoco'; }
        else if (/noite/i.test(t.nome) && !/longa|3h|madrug/i.test(t.nome)) { t.ini = '18:30'; t.fim = '23:30'; t.setor = 'hamburgueria'; if (!(t.dias && t.dias.length)) t.dias = [0,1,2,3,4]; if (!/23h30/.test(t.nome)) t.nome = 'Noite (até 23h30)'; }
      }
      if (/noite/i.test(t.nome) && t.setor === 'almoco') t.setor = 'hamburgueria';
    });
    const nl = S.turnos.find(t => /longa/i.test(t.nome)), fe = (S.funcoes || []).find(x => x.entrega);
    if (nl && fe && fe.valores && fe.valores[nl.id] && num(fe.valores[nl.id].porEntrega) === 10) fe.valores[nl.id].porEntrega = 12;
    S.turnosV2 = true;
  }
  if (!S.exLucasPago) { S.funcionarios.filter(f => f.ativo === false && /exemplo/i.test(f.nome) && !S.pagamentos.some(p => p.func === f.id)).forEach(f => { const ls = S.diarias.filter(d => d.func === f.id).map(d => d.data).sort(); if (ls.length) S.pagamentos.push({id:uid(), func:f.id, data:ls[ls.length - 1], de:ls[0], ate:ls[ls.length - 1], valor:S.diarias.filter(d => d.func === f.id).reduce((a, d) => a + num(d.valor), 0)}); }); S.exLucasPago = true; } if (!S.vendasV2) { Object.entries(S.vendas).forEach(([d, dia]) => { const novo = {}; Object.entries(dia).forEach(([k, v]) => { if (k.includes('|')) { novo[k] = Object.assign(novo[k] || {}, v); return; } Object.entries(v).forEach(([id, q]) => { const pr = byId(S.produtos, id); const nk = `${pr && pr.setor === 'almoco' ? 'almoco' : 'hamburgueria'}|${k}`; novo[nk] = novo[nk] || {}; novo[nk][id] = num(novo[nk][id]) + num(q); }); }); S.vendas[d] = novo; }); S.vendasV2 = true; CACHE = {}; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} } S.ui.dia = S.ui.dia || dataHoje; if (!canais().some(c => c.id === S.ui.canal)) S.ui.canal = 'balcao'; if (!canais().some(c => c.id === S.ui.canalDia)) S.ui.canalDia = 'balcao'; }
S = load(); prep(); S.ui.dia = dataHoje; S.ui.mes = mesHoje; S.ui.diaEq = dataHoje; S.ui.periodo = periodoAgora(); S.ui.entOpen = false; S.ui.entTurno = null; S.ui.emPick = null; S.ui.vendaPop = null; S.ui.vendaCanal = null; S.ui.vendaCombo = null; S.ui.vendaQtd = 1; S.ui.saindo = null; S.ui.fechar = false; S.ui.pedEdit = null; S.ui.precoApps = null; S.ui.eqAdd = false; S.ui.lancOpen = false;

/* =================== CÁLCULOS =================== */
function canais(){ return [{id:'balcao', nome:'Balcão'}, {id:'propria', nome:'Entrega própria'}, ...S.apps.map(a => ({id:a.id, nome:a.nome, app:a}))]; }
const nomeCanal = id => id === 'whats' ? 'WhatsApp/Telefone' : (canais().find(c => c.id === id) || {nome:'?'}).nome;
const custoUn = i => num(i.rende) > 0 ? num(i.preco) / num(i.rende) : 0;
const totalFixos = () => S.gastos.reduce((a, g) => a + num(g.valor), 0);
const custoItem = it => { const i = byId(S.ingredientes, it.ing); return i ? custoUn(i) * num(it.qtd) : 0; };
const usoIng = id => S.produtos.filter(p => (p.itens || []).some(it => it.ing === id)).length;

function equipeMes(ym){
  const ls = S.diarias.filter(d => d.data.startsWith(ym));
  const isEnt = d => { const f = byId(S.funcionarios, d.func); return ehEnt(f); };
  return {
    ls, total: ls.reduce((a, d) => a + num(d.valor), 0),
    entregas: ls.reduce((a, d) => a + (isEnt(d) ? num(d.entregas) : 0), 0),
    pagoEntreg: ls.reduce((a, d) => a + (isEnt(d) ? num(d.valor) : 0), 0),
    faltas: S.faltas.filter(f => f.data.startsWith(ym)),
  };
}
function funcMensal(){
  if (CACHE.fm) return CACHE.fm;
  const meses = [...new Set(S.diarias.map(d => d.data.slice(0, 7)))].filter(m => m < mesHoje).sort().slice(-3);
  let r;
  if (meses.length) r = {valor: meses.reduce((a, m) => a + equipeMes(m).total, 0) / meses.length, fonte: 'média de ' + meses.map(m => nomeMes(m)).join(', ')};
  else { const eq = equipeMes(mesHoje); r = eq.total > 0 ? {valor: eq.total / hoje.getDate() * diasMes(mesHoje), fonte:'previsão pelo que já foi lançado este mês'} : {valor:0, fonte:'ainda sem lançamentos'}; }
  return CACHE.fm = r;
}
function qtdMes(ym){
  let q = 0; Object.entries(S.vendas).forEach(([d, dia]) => { if (!d.startsWith(ym)) return; Object.values(dia).forEach(c => Object.entries(c).forEach(([id, v]) => { if (id !== '_pedidos' && byId(S.produtos, id)) q += num(v); })); });
  return q;
}
function vendasMes(){
  if (CACHE.vm) return CACHE.vm;
  const meses = [...new Set(Object.keys(S.vendas).map(d => d.slice(0, 7)))].filter(m => m < mesHoje).sort().slice(-3);
  let r;
  if (meses.length) r = {valor: meses.reduce((a, m) => a + qtdMes(m), 0) / meses.length, fonte: 'média real de ' + meses.map(m => nomeMes(m)).join(', ')};

function base(p){
  let ing = 0, emb = 0;
  if (p.setor === 'combo') {
    (p.comp || []).forEach(c => {
      const q = num(c.qtd);
      if (c.tipo === 'rev') { const r = byId(S.revenda, c.id); if (r) ing += num(r.custo) * q; }
      else { const pp = byId(S.produtos, c.id); if (pp && pp.setor !== 'combo') { const b = base(pp); ing += b.ing * q; emb += b.emb * q; } }
    });
  } else (p.itens || []).forEach(it => { const i = byId(S.ingredientes, it.ing); if (!i) return; const v = custoUn(i) * num(it.qtd); if (i.cat === 'embalagem') emb += v; else ing += v; });
  return {ing, emb};
}

function custoEnt(){ const r = custoEntregaReal(); return r > 0 ? r : (num(S.config.custoEntrega) || 9); }
function entregaPedido(canal){
  const app = byId(S.apps, canal);
  if (canal === 'propria') return {v: custoEnt() - num(S.config.taxaEntrega), txt: num(S.config.taxaEntrega) > 0 ? `Entrega (paga ${fmt(custoEnt())} ao entregador, cliente paga ${fmt(num(S.config.taxaEntrega))})` : `Entrega (paga ${fmt(custoEnt())} ao entregador, cliente não paga)`};
  if (!app) return {v:0, txt:''};
  if (app.quemEntrega === 'loja') return app.freteGratis ? {v: custoEnt(), txt:'Entrega com frete grátis (paga o entregador)'} : {v: custoEnt() - num(app.frete), txt:`Entrega (paga ${fmt(custoEnt())} ao entregador, cliente paga ${fmt(num(app.frete))})`};
  return app.freteGratis ? {v: num(app.frete), txt:`Frete grátis (a loja paga ${fmt(num(app.frete))} ao app)`} : {v:0, txt:''};
}
// calc de um item num canal. vendas=true: sem entrega e sem contas (usado na soma do mês)
function calc(p, canal, vendas){
  const b = base(p), app = byId(S.apps, canal);
  const preco = app ? (num((p.precos || {})[app.id]) || num(p.precoApp) || num(p.preco)) : num(p.preco);
  const pctTaxa = app ? num(app.comissao) + num(app.taxaPag) : num(S.config.taxa);
  const taxa = preco * pctTaxa / 100;
  const ent = vendas ? {v:0, txt:''} : entregaPedido(canal);
  const fixo = vendas ? 0 : fixoPorVenda();
  const total = b.ing + b.emb + taxa + ent.v + fixo, lucro = preco - total, margem = preco > 0 ? lucro / preco * 100 : 0;
  const div = 1 - pctTaxa / 100 - num(S.config.margem) / 100;
  const sugerido = div > 0 ? (b.ing + b.emb + ent.v + fixo) / div : 0;
  return {preco, ing:b.ing, emb:b.emb, taxa, pctTaxa, app, ent, fixo, total, lucro, margem, sugerido, contrib: preco - b.ing - b.emb - taxa - ent.v};
}
function calcRev(r, canal){
  const app = byId(S.apps, canal), preco = num(r.preco), pctTaxa = app ? num(app.comissao) + num(app.taxaPag) : num(S.config.taxa);
  const taxa = preco * pctTaxa / 100, lucro = preco - num(r.custo) - taxa;
  return {preco, custo:num(r.custo), taxa, lucro, contrib:lucro, margem: preco > 0 ? lucro / preco * 100 : 0};

function valoresDe(f, t){

function pagar(funcId, turnoId, entregas){

}
// resultado de um dia (todas as vendas lançadas)
function resultadoDia(data){
  const dia = S.vendas[data] || {}; let fat = 0, contrib = 0, itens = 0;
  const porCanal = {}, porItem = {}, porSetor = {almoco:{fat:0, contrib:0, itens:0}, hamburgueria:{fat:0, contrib:0, itens:0}};
  const addS = (s, f, c, i) => { const x = porSetor[s] || porSetor.hamburgueria; x.fat += f; x.contrib += c; x.itens += i; };
  Object.entries(dia).forEach(([chave, v]) => {
    const [per, canal] = chave.includes('|') ? chave.split('|') : [null, chave];
    const app = byId(S.apps, canal); let cf = 0, cc = 0;
    Object.entries(v).forEach(([id, q]) => {
      if (id === '_pedidos') return; q = num(q); if (!q) return;
      const p = byId(S.produtos, id), r = p ? null : byId(S.revenda, id); if (!p && !r) return;
      const c = p ? calc(p, canal, true) : calcRev(r, canal);
      cf += q * c.preco; cc += q * c.contrib; if (p) itens += q;
      addS(per || (p && p.setor === 'almoco' ? 'almoco' : 'hamburgueria'), q * c.preco, q * c.contrib, p ? q : 0);
      const pi = porItem[id] = porItem[id] || {q:0, fat:0, lucro:0}; pi.q += q; pi.fat += q * c.preco; pi.lucro += q * c.contrib;
    });
    const ped = num(v._pedidos); let ef = 0, ec = 0;
    if (canal === 'propria') { ef = ped * num(S.config.taxaEntrega); ec = ef; }
    else if (app) {
      if (app.quemEntrega === 'loja' && !app.freteGratis) { ef = ped * num(app.frete); ec = ef; }
      if (app.quemEntrega === 'app' && app.freteGratis) ec -= ped * num(app.frete);
    }
    cf += ef; cc += ec; addS(per || 'hamburgueria', ef, ec, 0);
    const pc = porCanal[canal] = porCanal[canal] || {fat:0, contrib:0, pedidos:0}; pc.fat += cf; pc.contrib += cc; pc.pedidos += ped;
    fat += cf; contrib += cc;
  });
  (S.pedidos || []).filter(p => p.data === data).forEach(pd => {
    const c = calcPedido(pd), share = c.cheio > 0 ? c.valor / c.cheio : 1;
    fat += c.valor; contrib += c.contrib; itens += c.itens; addS(pd.periodo, c.valor, c.contrib, c.itens);
    const pc = porCanal[pd.origem] = porCanal[pd.origem] || {fat:0, contrib:0, pedidos:0}; pc.fat += c.valor; pc.contrib += c.contrib; pc.pedidos++;
    c.linhas.forEach(l => { const f = l.preco * l.q * share, pi = porItem[l.id] = porItem[l.id] || {q:0, fat:0, lucro:0}; pi.q += l.q; pi.fat += f; pi.lucro += c.cheio > 0 ? c.contrib * (l.preco * l.q / c.cheio) : 0; });
  });
  return {fat, contrib, itens, porCanal, porItem, porSetor};
}
function resultadoMes(ym){
  const key = 'rm' + ym; if (CACHE[key]) return CACHE[key];
  const dm = diasMes(ym), fixos = totalFixos(), eq = equipeMes(ym);
  let fat = 0, contrib = 0, itens = 0; const porCanal = {}, porItem = {}, porDia = [], porSetor = {almoco:{fat:0, contrib:0, itens:0}, hamburgueria:{fat:0, contrib:0, itens:0}};
  for (let d = 1; d <= dm; d++) {
    const data = `${ym}-${pad(d)}`, r = resultadoDia(data);
    fat += r.fat; contrib += r.contrib; itens += r.itens;
    Object.entries(r.porCanal).forEach(([c, x]) => { const pc = porCanal[c] = porCanal[c] || {fat:0, contrib:0}; pc.fat += x.fat; pc.contrib += x.contrib; });
    Object.entries(r.porSetor).forEach(([s, x]) => { porSetor[s].fat += x.fat; porSetor[s].contrib += x.contrib; porSetor[s].itens += x.itens; });
    Object.entries(r.porItem).forEach(([id, x]) => { const pi = porItem[id] = porItem[id] || {q:0, fat:0, lucro:0}; pi.q += x.q; pi.fat += x.fat; pi.lucro += x.lucro; });
    const func = eq.ls.filter(x => x.data === data).reduce((a, x) => a + num(x.valor), 0);
    porDia.push({d, data, fat:r.fat, contrib:r.contrib, func, temVenda: !!S.vendas[data]});

}

  let n = 0; for (let d = 1; d <= ate; d++) if (planejado(f, `${ym}-${pad(d)}`)) n++;

function statusDia(f, data){
  if (S.diarias.some(x => x.func === f.id && x.data === data)) return (escalado(f, data) || extraDe(f, data)) ? 'ok' : 'extra';
  if (S.faltas.some(x => x.func === f.id && x.data === data)) return 'falta';

function periodoAgora(){ const v = String((S && S.config && S.config.viradaHora) || '16:00').split(':').map(Number); return hoje.getHours() * 60 + hoje.getMinutes() < (v[0] * 60 + (v[1] || 0)) ? 'almoco' : 'hamburgueria'; }
const toMin = s => { const [a, b] = String(s || '').split(':').map(Number); return isNaN(a) ? null : a * 60 + (b || 0); };
const turnoSetor = t => t ? (t.setor || ((toMin(t.ini) ?? 9999) < 16 * 60 ? 'almoco' : 'hamburgueria')) : 'hamburgueria';

function turnoCaixa(){
  const d = S.ui.dia, per = S.ui.periodo;
  if (d === dataHoje) { const a = turnoAgora(); if (a.t && turnoSetor(a.t) === per) return a.t; }
  const ok = t => !(t.dias && t.dias.length) || t.dias.includes(dow(d));
  return S.turnos.find(t => turnoSetor(t) === per && ok(t)) || S.turnos.find(t => turnoSetor(t) === per) || S.turnos[0];
}
const turnoEqAdd = () => (S.ui.eqAddTurno && byId(S.turnos, S.ui.eqAddTurno)) || turnoCaixa();
const precisaPedido = c => c !== 'balcao';
const lojaEntrega = c => c === 'propria' || ((byId(S.apps, c) || {}).quemEntrega === 'loja');
function vender(item, canal, entId, novo){
  const qtd = Math.max(1, +S.ui.vendaQtd || 1);
  const d = S.ui.dia, key = `${S.ui.periodo}|${canal}`;
  S.vendas[d] = S.vendas[d] || {}; const v = S.vendas[d][key] = S.vendas[d][key] || {};
  v[item] = num(v[item]) + qtd;
  let lanc = null, ped = false;
  if (novo && canal !== 'balcao') { v._pedidos = num(v._pedidos) + 1; ped = true; }
  if (entId && novo) {
    const t = turnoCaixa();
    if (t) {
      let l = S.diarias.find(x => x.func === entId && x.data === d && x.turno === t.id);
      if (!l) { l = {id:uid(), data:d, func:entId, turno:t.id, entregas:0, valor:0}; S.diarias.push(l); S.faltas = S.faltas.filter(x => !(x.func === entId && x.data === d)); S.dispensas = S.dispensas.filter(x => !(x.func === entId && x.data === d)); }
      l.entregas = num(l.entregas) + 1; l.horas = (l.horas || []).concat(horaAgora()); l.valor = pagar(entId, t.id, l.entregas); lanc = l.id;
    }
  }
  S.vendaLog.push({id:uid(), data:d, key, item, ped, lanc, qtd}); if (S.vendaLog.length > 400) S.vendaLog = S.vendaLog.slice(-400);
}
function desfazerVenda(item){
  const d = S.ui.dia, pre = S.ui.periodo + '|', dia = S.vendas[d] || {};
  let i = -1; for (let k = S.vendaLog.length - 1; k >= 0; k--) { const x = S.vendaLog[k]; if (x.data === d && x.item === item && x.key.startsWith(pre)) { i = k; break; } }
  if (i >= 0) {
    const x = S.vendaLog[i], v = dia[x.key] || {};
    if (num(v[item]) > 0) { v[item] = Math.max(0, num(v[item]) - (x.qtd || 1)); if (!v[item]) delete v[item]; }
    if (x.ped && num(v._pedidos) > 0) { v._pedidos = num(v._pedidos) - 1; if (!v._pedidos) delete v._pedidos; }
    const l = x.lanc && byId(S.diarias, x.lanc);
    if (l) { l.entregas = Math.max(0, num(l.entregas) - 1); if (l.horas) l.horas.pop(); l.valor = pagar(l.func, l.turno, l.entregas); }
    S.vendaLog.splice(i, 1); return;
  }
  const k = Object.keys(dia).find(k => k.startsWith(pre) && num(dia[k][item]) > 0);
  if (k) { dia[k][item] = num(dia[k][item]) - 1; if (!dia[k][item]) delete dia[k][item]; }
}

  const meses = [...new Set(S.diarias.map(d => d.data.slice(0, 7)))].sort().slice(-2);
  let ent = 0, pago = 0; meses.forEach(m => { const e = equipeMes(m); ent += e.entregas; pago += e.pagoEntreg; });
  return CACHE.cer = ent > 0 ? pago / ent : 0;
}

    refreshCalc(p);

  } else if (k === 'turno') {

    if (f === 'pagaDia') { fu.pagaDia = val; save(); return; }

    if (f === 'tipo' || f === 'funcao') { const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (f === 'nome') { const o = document.querySelector(`#ld-func option[value="${fu.id}"]`); if (o) o.textContent = fu.nome; }
    prevLanc();
  } else if (k === 'pedval') {
    const pd = byId(S.pedidos, id); if (!pd) return; pd.valor = t.value.trim() === '' ? null : num(t.value); save(); refreshVendas();
  } else if (k === 'pedent') {
    const pd = byId(S.pedidos, id); if (!pd) return; tirarEntrega(pd); pd.ent = t.value; pd.lanc = somaEntrega(pd.ent, pd.data, 1); save(); const y = window.scrollY; render(); window.scrollTo(0, y);

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
function armar(btn, fn, texto){
  if (btn.dataset.arm) { fn(); return; }
  btn.dataset.arm = '1'; const txt = btn.textContent; btn.classList.add('arm'); btn.textContent = texto || (btn.classList.contains('x') ? '?' : 'Confirmar?');
  setTimeout(() => { if (document.body.contains(btn)) { delete btn.dataset.arm; btn.classList.remove('arm'); btn.textContent = txt; } }, 3500);
}
